[mod]
id = "fair_freecam"
version = "1.2.0"
priority = 100

# The commit it was tested on. Besides Horizon's native hook points it hooks
# the camera, turning, the hand, the player's tick and clicks, which are not
# hook points: it is pinned to this commit.
[compatibility]
horizon_revision = "aa27eca326db26e999d4e59d7899576016764b1e"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "fair_freecam"
source = "runtime.rs"

# --- Horizon's native hook points ---

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "wheel"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_wheel"
helper = "wheel.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "restore"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "restore.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings-click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "settings_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# --- The camera, turning and the player's own body ---

[[injection]]
id = "camera"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::camera_view"
helper = "camera.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "turn"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::turn_player"
helper = "turn.rs"
bindings = [
  { name = "xo", ty = "f64", value = "xo" },
  { name = "yo", ty = "f64", value = "yo" },
]

[[injection]]
id = "body"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::own_body_in_view"
helper = "body.rs"
bindings = []

[[injection]]
id = "hand"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::hand_geometry"
helper = "hand.rs"
bindings = []

# --- The player stays put: no movement, no clicks ---

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::tick_remote_level"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "press"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::key_pressed"
helper = "press.rs"
bindings = [
  { name = "key", ty = "winit::keyboard::KeyCode", value = "key" },
]

[[injection]]
id = "click"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::play_mouse"
helper = "click.rs"
bindings = [
  { name = "pressed", ty = "bool", value = "pressed" },
]
